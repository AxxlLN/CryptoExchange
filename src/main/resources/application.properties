# Application settings
spring.application.name=exchange
server.port=${SERVER_PORT}

# DB
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI
# http://localhost:8080/swagger-ui.html
# http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}

# Crypto API
app.crypto.target-symbols=BTC,ETH,USDT,BNB,SOL,XRP,ADA,DOGE
app.crypto.update-interval-ms=300000
app.coinlore.base-url=https://api.coinlore.net/api/tickers/
app.coinlore.connect-timeout-ms=5000
app.coinlore.read-timeout-ms=5000

# Logs
logging.file.name=logs/crypto-exchange.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
